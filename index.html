<style>
/* Layout: one narrow reading column; the prompt is the page, everything else is quiet chrome. */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --fg:#1d2321; --muted:#68716d; --line:#d9ddd8;
  --accent:#1f4e8c; --ok:#2c6e49; --ok-bg:#e3f0e7; --bad:#a63a28; --bad-bg:#f6e4df;
  --font-text:ui-serif, "New York", Georgia, "Times New Roman", serif;
  --font-ui:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121514; --surface:#1a1e1d; --fg:#e4e8e5; --muted:#949d98; --line:#2d3331;
  --accent:#8db2ea; --ok:#7fc59a; --ok-bg:#1c2e23; --bad:#ec9480; --bad-bg:#352220; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#121514; --surface:#1a1e1d; --fg:#e4e8e5; --muted:#949d98; --line:#2d3331;
  --accent:#8db2ea; --ok:#7fc59a; --ok-bg:#1c2e23; --bad:#ec9480; --bad-bg:#352220; color-scheme:dark }
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:16px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:34rem;margin:0 auto;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-family:var(--font-text);font-weight:600;font-size:1.15rem;letter-spacing:.01em}
.meta{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.bar{height:2px;background:var(--line);border-radius:1px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.prompt{font-family:var(--font-text);font-size:1.35rem;line-height:1.4;text-wrap:balance}
.cue{font-size:.85rem;color:var(--accent)}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--accent);height:1em;vertical-align:-.1em}
.hint{color:var(--muted);font-size:.85em}
input[type=text],textarea{width:100%;box-sizing:border-box;font:400 18px/1.4 var(--font-text);color:var(--fg);
  background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
input[type=text]:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
input[readonly]{opacity:.75}
.row{display:flex;flex-wrap:wrap;gap:10px}
button{font:700 .95rem var(--font-ui);border-radius:8px;padding:11px 16px;border:1px solid var(--line);
  background:var(--surface);color:var(--fg);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
button.quiet{background:none;border-color:transparent;color:var(--muted);padding-inline:6px;font-weight:400;text-decoration:underline;text-underline-offset:3px}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opts{display:flex;flex-direction:column;gap:8px}
.opts button{text-align:left;font:400 1.05rem/1.35 var(--font-text);padding:12px 14px}
.opts button.right{background:var(--ok-bg);border-color:var(--ok)}
.opts button.wrong{background:var(--bad-bg);border-color:var(--bad)}
.verdict{border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px}
.verdict.ok{background:var(--ok-bg)} .verdict.bad{background:var(--bad-bg)}
.v-head{font-weight:700} .ok .v-head{color:var(--ok)} .bad .v-head{color:var(--bad)}
.answer{font-family:var(--font-text);font-size:1.1rem;line-height:1.45}
.answer mark{background:none;color:var(--bad);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.answer s{color:var(--muted)}
.yours{font-size:.95rem;color:var(--muted)}
.note{font-family:var(--font-text);font-size:.98rem;color:var(--fg)}
.alts{font-size:.9rem;color:var(--muted)}
.unit{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:6px}
.unit h2{margin:0;font:600 1.15rem/1.3 var(--font-text)}
.unit p{margin:0;color:var(--muted);font-size:.9rem}
.unit .row{margin-top:8px}
section h3{margin:0 0 6px;font:700 .75rem var(--font-ui);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.notes pre{white-space:pre-wrap;font:400 .85rem/1.45 ui-monospace,Menlo,monospace;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;max-height:16rem;overflow:auto;margin:0}
.misses{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.misses li{border-top:1px solid var(--line);padding-top:10px}
.misses .en{color:var(--muted);font-size:.9rem}
.small{font-size:.85rem;color:var(--muted)}
@media (prefers-reduced-motion: reduce){.bar>i{transition:none}}
.frame{display:flex;flex-direction:column;gap:6px;font-family:var(--font-text);font-size:1.15rem}
.frame .given{color:var(--muted)}
.frame input[type=text]{width:100%}
.redo{font-family:var(--font-text);font-size:1.2rem;line-height:2.3}
.redo input.bl{display:inline-block;width:auto;padding:3px 8px;margin:0 2px;border-radius:6px;font-size:18px;vertical-align:baseline}
.redo input.bl.ok{border-color:var(--ok);background:var(--ok-bg)}
.redo input.bl.bad{border-color:var(--bad);background:var(--bad-bg)}
.answer ins{text-decoration:none;color:var(--ok);font-weight:600}
@media (prefers-reduced-motion: reduce){.bar>i{transition:none}}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.toprow .quiet{padding:4px 0}
.tip{margin:0;font-size:.9rem;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.units{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.units li{border-bottom:1px solid var(--line)}
.ulist{width:100%;display:flex;gap:14px;align-items:flex-start;text-align:left;background:none;border:0;border-radius:0;padding:12px 2px;font-weight:400}
.ulist:disabled{cursor:default;opacity:.55}
.ulist .un{font:600 1.05rem var(--font-text);color:var(--accent);min-width:1.6em;font-variant-numeric:tabular-nums}
.ulist .ut{display:flex;flex-direction:column;gap:2px;min-width:0}
.ulist b{font:600 1rem/1.3 var(--font-text)}
.ulist small{color:var(--muted);font-size:.85rem}
.filebtn{display:inline-block;font:700 .95rem var(--font-ui);border-radius:8px;padding:11px 16px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
section{display:flex;flex-direction:column}
</style>

</head>

 estación?", "¿Quieres que te vaya a recoger a la estación?", "¿Quieres que vaya a recogerte a la estación?", "¿Quieres que vaya a la estación a recogerte?", "¿Quieres que vaya a la estación a buscarte?"]}, {"id": "1-ac64e6", "u": 1, "t": "mc", "note": "Salir → salga, de «salgo». Esperar que pide subjuntivo.", "w": false, "cue": "", "s": "Espero que el examen te ___ bien.", "o": ["salga", "sale", "saldrá", "salir"], "acc": ["salga"], "show": "Espero que el examen te salga bien."}, {"id": "1-b4a3d9", "u": 1, "t": "tr", "note": "Verbo pronominal: que os preocupéis.", "w": false, "cue": "vosotros", "p": "I don't want you to worry.", "acc": ["No quiero que os preocupéis."], "show": "No quiero que os preocupéis.", "alts": []}, {"id": "1-3d0827", "u": 1, "t": "tr", "note": "Mismo sujeto: infinitivo. Nada de «quiere que compre».", "w": false, "cue": "", "p": "She wants to buy a new car.", "acc": ["Quiere comprarse", "Se quiere comprar", "Quiere comprar"], "show": "Quiere comprarse un coche nuevo.", "alts": ["Se quiere comprar un coche nuevo.", "Quiere comprar un coche nuevo."], "fs": "", "fe": "un coche nuevo."}, {"id": "1-7c0ace", "u": 1, "t": "gap", "note": "Ser es irregular: sea, seas, sea, seamos, seáis, sean.", "w": false, "cue": "", "acc": ["seamos"], "s": "Mis abuelos desean que ___ (ser, nosotros) felices.", "show": "Mis abuelos desean que seamos felices."}, {"id": "1-1847a1", "u": 1, "t": "tr", "note": "«Pasarlo bien» es la forma natural de «have a good time».", "w": false, "cue": "vosotros", "p": "I hope you have a great time in Seville.", "acc": ["Espero que lo paséis muy bien", "Espero que os lo paséis muy bien", "Espero que lo paséis genial", "Espero que os lo paséis genial", "Espero que lo paséis de maravilla", "Espero que os lo paséis de maravilla", "Espero que lo paséis bien", "Espero que os lo paséis bien", "Espero que lo paséis en grande", "Espero que os lo paséis en grande", "Espero que lo paséis fenomenal", "Espero que os lo paséis fenomenal", "Espero que disfrutéis mucho"], "show": "Espero que lo paséis muy bien en Sevilla.", "alts": ["Espero que os lo paséis muy bien en Sevilla.", "Espero que lo paséis genial en Sevilla.", "Espero que os lo paséis genial en Sevilla.", "Espero que lo paséis de maravilla en Sevilla.", "Espero que os lo paséis de maravilla en Sevilla.", "Espero que lo paséis bien en Sevilla.", "Espero que os lo paséis bien en Sevilla.", "Espero que lo paséis en grande en Sevilla.", "Espero que os lo paséis en grande en Sevilla.", "Espero que lo paséis fenomenal en Sevilla.", "Espero que os lo paséis fenomenal en Sevilla.", "Espero que disfrutéis mucho en Sevilla."], "fs": "", "fe": "en Sevilla."}, {"id": "1-b08d7a", "u": 1, "t": "tr", "note": "Hacer → haga, de «hago».", "w": false, "cue": "tú", "p": "What do you want me to do?", "acc": ["¿Qué quieres que haga?"], "show": "¿Qué quieres que haga?", "alts": []}, {"id": "1-b3d9b7", "u": 1, "t": "mc", "note": "Coger → cojáis: la g pasa a j delante de a.", "w": false, "cue": "vosotros", "s": "Prefiero que ___ el metro; es más rápido.", "o": ["cojáis", "cogéis", "coger", "cogeréis"], "acc": ["cojáis"], "show": "Prefiero que cojáis el metro; es más rápido."}, {"id": "1-67ca24", "u": 1, "t": "tr", "note": "Verbo de deseo con otro sujeto: que + presente de subjuntivo. Mismo sujeto: infinitivo (quiero ir / quiero que vayas).", "w": false, "cue": "", "p": "The doctor wants me to rest for a week.", "acc": ["quiere que descanse una semana.", "quiere que descanse durante una semana.", "quiere que guarde reposo una semana.", "quiere que guarde reposo durante una semana.", "quiere que repose una semana.", "quiere que repose durante una semana."], "show": "El médico quiere que descanse una semana.", "alts": ["El médico quiere que descanse durante una semana.", "El médico quiere que guarde reposo una semana.", "El médico quiere que guarde reposo durante una semana.", "El médico quiere que repose una semana.", "El médico quiere que repose durante una semana."], "fs":     const c=a[i-1]===b[j-1]?0:1;
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);
    if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);

  return d[n][m];
}
// A word counts as a typo only if what was typed is not itself a real word:
// "hanria" for "habría" passes; "había" or "hubieras" for "hubiera" does not.
function typoDiff(expected, typed){
  const E=expected.split(' '), T=typed.split(' ');
  if(E.length!==T.length) return null;
  const bad=[];
  for(let i=0;i<E.length;i++){
    if(E[i]===T[i]) continue;
    const e=E[i], t=T[i];
    if(e.length<4 || LEX.has(t)) return null;
    if(dist(e,t) > (e.length>=9?2:1)) return null;
    // a vowel changed near the end is a mood or person error (hable/habla, vengas/venga), never a typo
    if(e.length===t.length){ const dif=[...e].map((c,k)=>c!==t[k]?k:-1).filter(k=>k>=0);
      if(dif.length===1 && dif[0]>=e.length-3 && /[aeiou]/.test(e[dif[0]]) && /[aeiou]/.test(t[dif[0]])) return null }
    if(Math.abs(e.length-t.length)===1){ const L=e.length>t.length?e:t, Sh=e.length>t.length?t:e;
      if(L.slice(0,-3)===Sh.slice(0,L.length-3) && /[aeiou]/.test(L.slice(-3))) { let k=0; while(k<Sh.length&&L[k]===Sh[k]) k++; if(k>=L.length-3) return null } }
    bad.push(e);
  }
  if(!bad.length || bad.length>Math.min(2, Math.max(1, Math.floor(E.length/5)))) return null;
  return bad;
}
function matchOne(ans, input){
  // compare one expected string with what was typed
  const S=strict(input), L=loose(input);
  if(strict(ans)===S) return {ok:true, kind:'exact'};
  if(loose(ans)===L) return {ok:true, kind: (deacc(strict(ans))===deacc(S) && strict(ans)!==S) ? 'accent':'exact'};
  const R=seToRa(L);
  if(R!==L && loose(ans)===R) return {ok:true, kind:'se'};
  const ty = typoDiff(loose(ans), R);
  if(ty) return {ok:true, kind:'typo', typos:ty};
  return null;
}
// if the learner also typed the pre-filled words, ignore them
function stripGiven(item, input){
  let w=input.trim().split(/\s+/);
  const same=(x,y)=>loose(x.join(' '))===loose(y);
  if(item.fe){ const n=item.fe.split(' ').length; if(w.length>n && same(w.slice(-n), item.fe)) w=w.slice(0,-n) }
  if(item.fs){ const n=item.fs.split(' ').length; if(w.length>n && same(w.slice(0,n), item.fs)) w=w.slice(n) }
  return w.join(' ');
}
function check(item, input){
  if(!input.trim()) return {ok:false, best:item.acc[0]};
  if(item.fs||item.fe) input=stripGiven(item, input);
  const order=['exact','accent','se','typo'];
  let found=null;
  for(const a of item.acc){ const r=matchOne(a,input); if(r && (!found || order.indexOf(r.kind)<order.indexOf(found.kind))) found={...r, match:a} }
  if(found) return found;
  let best=item.acc[0], bs=-1;
  for(const a of item.acc){ const sc=lcs(toks(a),toks(input)).score; if(sc>bs){bs=sc;best=a} }
  return {ok:false, best};
}
const toks = s => strict(s).split(' ').filter(Boolean);
function lcs(a,b){
  const A=a.map(deacc), B=b.map(deacc), n=A.length, m=B.length;
  const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const inA=new Array(n).fill(false), inB=new Array(m).fill(false);
  let i=0,j=0; while(i<n&&j<m){ if(A[i]===B[j]){inA[i]=inB[j]=true;i++;j++} else if(dp[i+1][j]>=dp[i][j+1]) i++; else j++ }
  return {score:dp[0][0], inA, inB};
}
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// split a display word into leading punctuation, core, trailing punctuation
function parts(w){ const m=w.match(/^([¿¡«"(]*)(.*?)([.,;:!?»")…]*)$/); return {lead:m[1], core:m[2], trail:m[3]} }
function missedWords(expected, input){
  const words=expected.split(' '), {inA}=lcs(toks(expected), toks(input));
  let k=0; return words.map(w=>{ const n=toks(w).length; if(!n) return false; let hit=true; for(let x=0;x<n;x++) if(!inA[k++]) hit=false; return !hit });
}
function diffHTML(expected, input){
  const words=expected.split(' '), miss=missedWords(expected,input);
  const exp=words.map((w,i)=>miss[i]?'<mark>'+esc(w)+'</mark>':esc(w)).join(' ');
  const {inB}=lcs(toks(expected), toks(input));
  let q=0; const you=input.trim().split(/\s+/).map(w=>{ const n=toks(w).length; if(!n) return esc(w); let hit=true; for(let x=0;x<n;x++) if(!inB[q++]) hit=false; return hit?esc(w):'<s>'+esc(w)+'</s>' }).join(' ');
  return {exp, you};
}
const full = (it, mid) => [it.fs, mid, it.fe].filter(Boolean).join(' ');

// After a miss on a translation, the retry blanks out only the words that went wrong.
function makeRedo(it, best, input){
  const words=best.split(' '), miss=missedWords(best,input), n=miss.filter(Boolean).length;
  if(!n || n/words.length>0.6) return null;
  const segs=[]; if(it.fs) segs.push({text:it.fs});
  let i=0;
  while(i<words.length){
    if(!miss[i]){ segs.push({text:words[i]}); i++; continue }
    let j=i; while(j<words.length && miss[j]) j++;
    const run=words.slice(i,j), first=parts(run[0]), last=parts(run[run.length-1]);
    if(first.lead) segs.push({text:first.lead});
    const inner = run.length===1 ? first.core : [first.lead?run[0].slice(first.lead.length):run[0], ...run.slice(1,-1), run[run.length-1].slice(0, run[run.length-1].length-last.trail.length)].join(' ');
    segs.push({blank:inner, glue:!!first.lead});
    if(last.trail) segs.push({text:last.trail, glue:true});
    i=j;
  }
  if(it.fe) segs.push({text:it.fe});
  return {segs, best};
}



// ---------- course data ----------
const items = DATA.items;
const byId = Object.fromEntries(items.map(i=>[i.id,i]));
const unitsMeta = DATA.meta;                    // {u:{title,struct,count,course:bool}}
const COURSE = DATA.course;                     // unit numbers in order, contiguous from 1
const EXTRA = Object.keys(unitsMeta).map(Number).filter(u=>!COURSE.includes(u)).sort((a,b)=>a-b);
const unitItems = {}; for(const it of items) (unitItems[it.u] ||= []).push(it.id);
const NEW_PER_DAY = 15, MAX_REVIEWS = 20;
const LADDER = [1,3,7,14,30,60,120,240];       // days until a unit's next review, by level

function today(){ const d=new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset()*60000)/86400000) }
function pruneStore(){ for(const id of Object.keys(store.items)) if(!byId[id]) delete store.items[id] }

// ---------- scheduling ----------
// Each unit is a structure. After all its items have been seen once, the unit is reviewed on a
// widening ladder; each review pulls the items of that unit seen least recently, so the same
// structure comes back in different sentences. Items missed get their own review the next day.
function seen(id){ return !!store.items[id] }
function newCandidates(){
  const out=[];
  for(const u of COURSE) for(const id of unitItems[u]) if(!seen(id)) out.push(id);
  return out;
}
function newLeftToday(){ const t=today(); return store.newDay===t ? Math.max(0, NEW_PER_DAY-store.newCount) : NEW_PER_DAY }
function dueUnits(){ const t=today(); return Object.entries(store.units).filter(([u,s])=>s.due<=t && unitsMeta[u]).sort((a,b)=>a[1].due-b[1].due).map(([u])=>+u) }
function dueItems(){ const t=today(); return Object.entries(store.items).filter(([id,s])=>s.due!=null && s.due<=t && byId[id]).sort((a,b)=>a[1].due-b[1].due).map(([id])=>id) }
function reviewSize(lvl){ return lvl<=1 ? 5 : lvl<=3 ? 4 : 3 }
function freshest(u, k, skip){
  // least recently seen items of a unit that have already been introduced
  const ids = unitItems[u].filter(id=>seen(id) && !skip.has(id));
  shuffle(ids);
  ids.sort((a,b)=>(store.items[a].last||0)-(store.items[b].last||0));
  return ids.slice(0,k);
}
function planToday(){
  const rev=[], unitRev={}, taken=new Set();
  for(const id of dueItems().slice(0,8)){ rev.push(id); taken.add(id) }
  for(const u of dueUnits()){
    if(rev.length>=MAX_REVIEWS) break;
    const ids = freshest(u, Math.min(reviewSize(store.units[u].lvl), MAX_REVIEWS-rev.length), taken);
    if(!ids.length) continue;
    unitRev[u] = {ids:new Set(ids), miss:0, left:new Set(ids)};
    for(const id of ids){ rev.push(id); taken.add(id) }
  }
  const fresh = newCandidates().slice(0, newLeftToday());
  return {rev, unitRev, fresh};
}

// ---------- sessions ----------
let S = null;
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a }
function startToday(extraNew){
  const p = planToday();
  let fresh = p.fresh;
  if(extraNew) fresh = newCandidates().slice(0, extraNew);
  const queue = extraNew ? fresh : shuffle(p.rev).concat(fresh);
  if(!queue.length) return renderHome();
  S = {mode:'today', title:'Hoy', queue, total:queue.length, unitRev: extraNew?{}:p.unitRev, isNew:new Set(fresh), done:new Set(), firstTry:0, missed:new Set(), attempts:{}, redo:{}};
  next();
}
function startPractice(u){
  // free practice on one unit: everything already introduced (or every item for pilot units)
  let ids = unitItems[u].filter(id=> COURSE.includes(+u) ? seen(id) : true);
  shuffle(ids); ids = ids.filter(id=>!byId[id].w).concat(ids.filter(id=>byId[id].w));
  if(COURSE.includes(+u)) ids = ids.slice(0, 30);
  S = {mode:'practice', title:'Unidad '+u, queue:ids, total:ids.length, unitRev:{}, isNew:new Set(), done:new Set(), firstTry:0, missed:new Set(), attempts:{}, redo:{}};
  next();
}
function next(){
  if(!S.queue.length) return finish();
  S.cur = byId[S.queue.shift()]; S.curRedo = S.redo[S.cur.id]||null; S.res=null; S.input=''; S.picked=null; S.blanks=null;
  renderDrill();
}
function grade(input, picked){
  const it=S.cur; S.input=input; S.picked=picked;
  const rd=S.curRedo;
  if(it.t==='mc') S.res={ok: picked===it.acc[0], kind:'exact', match:it.acc[0], best:it.acc[0]};
  else if(rd) S.res=gradeRedo(rd);
  else S.res=check(it, input);
  record(S.res.ok);
  renderDrill();
}
function gradeRedo(rd){
  const vals=S.blanks; let kind='exact', typos=[];
  const per = rd.segs.filter(s=>'blank' in s).map((s,i)=>{ const r=vals[i].trim() ? matchOne(s.blank, vals[i]) : null; if(r){ if(r.kind==='typo'){kind='typo'; typos=typos.concat(r.typos)} else if(r.kind==='se'&&kind!=='typo') kind='se'; else if(r.kind==='accent'&&kind==='exact') kind='accent' } return !!r });
  const ok=per.every(Boolean);
  return ok ? {ok, kind, typos, match:rd.best, per} : {ok, best:rd.best, per};
}
function record(ok){
  const it=S.cur, id=it.id, t=today(), n=(S.attempts[id]||0)+1; S.attempts[id]=n;
  const st = store.items[id] || {n:0, ok:0};
  const firstEver = !store.items[id];
  if(n===1){
    st.n++; if(ok) st.ok++; st.last=t;
    if(ok) delete st.due; else st.due = t+1;
    if(firstEver && S.mode==='today' && S.isNew.has(id)){
      if(store.newDay!==t){ store.newDay=t; store.newCount=0 }
      store.newCount++;
    }
    store.items[id]=st;
    // unit review bookkeeping
    const ur = S.unitRev[it.u];
    if(ur && ur.left.has(id)){
      ur.left.delete(id); if(!ok) ur.miss++;
      if(!ur.left.size){
        // up a level with at most one miss; two misses repeat the level; more drop back
        const us=store.units[it.u];
        if(ur.miss<=1){ us.lvl=Math.min(us.lvl+1, LADDER.length-1); us.due=t+LADDER[us.lvl] }
        else if(ur.miss===2){ us.due=t+LADDER[us.lvl] }
        else { us.lvl=Math.max(us.lvl-1, 0); us.due=t+1 }
        delete S.unitRev[it.u];
      }
    }
    // a unit enters the review ladder once every item has been seen
    if(COURSE.includes(it.u) && !store.units[it.u] && unitItems[it.u].every(seen)) store.units[it.u]={lvl:0, due:t+1, intro:t};
    store.answered=(store.answered||0)+1;
  }
  if(ok){ S.done.add(id); if(n===1) S.firstTry++; delete S.redo[id] }
  else {
    S.missed.add(id);
    if(it.t==='tr' && !S.redo[id]){ const rd=makeRedo(it, S.res.best, S.input); if(rd) S.redo[id]=rd }
    S.queue.splice(Math.min(4,S.queue.length),0,id);
  }
  save();
}
function override(){
  const it=S.cur, rd=S.curRedo, t=today();
  store.notes.push({id:it.id, u:it.u, tipo:'Tenía razón', prompt:it.p||it.s, suya: rd ? S.blanks.join(' / ') : S.input, esperada: rd ? rd.segs.filter(s=>'blank' in s).map(s=>s.blank).join(' / ') : full(it,S.res.best)});
  const i=S.queue.lastIndexOf(it.id); if(i>-1) S.queue.splice(i,1);
  if(S.attempts[it.id]===1){
    S.firstTry++; S.missed.delete(it.id);
    const st=store.items[it.id]; if(st){ st.ok++; delete st.due }
  }
  S.done.add(it.id); delete S.redo[it.id]; S.res={ok:true, kind:'override', match:S.input}; save(); renderDrill();
}
function finish(){ renderEnd() }

  const d=new Date(), stamp=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

function restoreBackup(file){

}

  const kind = rd ? 'Repite · solo lo que fallaste' : {tr:'Traduce', gap:'Completa', mc:'Elige'}[it.t];
  const where = S.mode==='today' ? (S.isNew.has(it.id) ? `Nuevo · unidad ${it.u}` : `Repaso · unidad ${it.u}`) : (it.w?'repaso':'');
  let body = `${header(`${esc(S.title)} · ${pos}/${S.total}`)}<div class="bar"><i style="width:${pct}%"></i></div>
    <div class="toprow"><span class="label">${kind}${where?' · '+where:''}</span><button class="quiet" id="stop">Parar</button></div>${promptHTML(it)}`;
  if(it.t==='mc'){
    if(!S.opts || S.optsFor!==it.id){ S.opts=shuffle(it.o.slice()); S.optsFor=it.id }
    body += `<div class="opts">${S.opts.map((o,i)=>{
      let cls=''; if(r){ if(o===it.acc[0]) cls='right'; else if(o===S.picked) cls='wrong' }
      return `<button data-opt="${i}" class="${cls}" ${r?'disabled':''}>${esc(o)}</button>` }).join('')}</div>`;
  } else if(rd){
    if(!S.blanks) S.blanks = rd.segs.filter(s=>'blank' in s).map(()=> '');
    body += redoHTML(rd, r);
  } else {
    const inp = `<input type="text" id="ans" ${INPUT_ATTRS} enterkeyhint="${r?'next':'done'}" ${r?'readonly':''} value="${esc(S.input)}" placeholder="${it.t==='gap'?'Solo lo que falta':'Escribe en español'}">`;
    body += (it.fs||it.fe) ? `<div class="frame">${it.fs?`<span class="given">${esc(it.fs)} …</span>`:''}${inp}${it.fe?`<span class="given">… ${esc(it.fe)}</span>`:''}</div>` : inp;
  }
  if(!r){
    if(it.t!=='mc') body += `<div class="row"><button class="primary" id="go">Comprobar</button></div>`;
  } else {
    body += verdictHTML(it, r, rd);
    body += `<div class="row"><button class="primary" id="nx">Siguiente</button>${(!r.ok && it.t!=='mc')?'<button id="ovr">Tenía razón</button>':''}<button class="quiet" id="flag">Señalar</button></div><div id="flagBox"></div>`;
  }
  app.innerHTML = body;
  window.scrollTo(0,0);
  const ans=document.getElementById('ans');
  if(ans){ ans.focus(); ans.setSelectionRange(ans.value.length, ans.value.length);
    ans.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); r ? next() : grade(ans.value) } } }
  const bls=[...app.querySelectorAll('input.bl')];
  bls.forEach((el,k)=>{
    el.oninput=()=>{ S.blanks[k]=el.value };
    el.onkeydown=e=>{ if(e.key!=='Enter') return; e.preventDefault();
      if(r) return next();
      if(k<bls.length-1) bls[k+1].focus(); else grade('') };
  });
  if(bls.length){ const first = r ? bls[0] : (bls.find(b=>!b.value)||bls[0]); first.focus() }
  app.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>grade('', S.opts[+b.dataset.opt]));
  const go=document.getElementById('go'); if(go) go.onclick=()=>grade(ans?ans.value:'');
  const nx=document.getElementById('nx'); if(nx){ nx.onclick=next; if(!ans && !bls.length) nx.focus() }
  const ov=document.getElementById('ovr'); if(ov) ov.onclick=override;
  const fl=document.getElementById('flag'); if(fl) fl.onclick=openFlag;
  document.getElementById('stop').onclick=finish;
}
function markTypos(text, typos){
  if(!typos || !typos.length) return esc(text);
  const set=new Set(typos);
  return text.split(' ').map(w=>{ const p=parts(w); return set.has(loose(p.core)) ? esc(p.lead)+'<ins>'+esc(p.core)+'</ins>'+esc(p.trail) : esc(w) }).join(' ');
}
function verdictHTML(it, r, rd){
  let h='';
  if(r.ok){
    const head = {exact:'Correcto.', accent:'Correcto. Ojo a las tildes:', se:'Correcto. Aquí usamos la forma en -ra:', typo:'Correcto, con una errata:', override:'Anotado como correcto.'}[r.kind];
    let shownAns;
    if(it.t==='gap') shownAns = esc(fillGap(it, r.match));
    else if(it.t==='mc') shownAns = esc(it.show);
    else shownAns = markTypos(full(it, r.match), r.typos);
    h = `<div class="verdict ok"><div class="v-head">${head}</div>${r.kind!=='override'?`<div class="answer">${shownAns}</div>`:''}`;
  } else if(it.t==='mc'){
    h = `<div class="verdict bad"><div class="v-head">No.</div><div class="answer">${esc(it.show)}</div>`;
  } else if(it.t==='gap'){
    h = `<div class="verdict bad"><div class="v-head">No.</div><div class="answer">${esc(fillGap(it,r.best)).replace(esc(r.best),'<mark>'+esc(r.best)+'</mark>')}</div>${S.input.trim()?`<div class="yours">Tu respuesta: ${esc(S.input)}</div>`:''}`;
  } else if(rd){
    let k=0; const txt = rd.segs.map((s,i)=>{ const sp=(i&&!s.glue)?' ':''; if('blank' in s){ const ok=r.per[k++]; return sp+(ok?esc(s.blank):'<mark>'+esc(s.blank)+'</mark>') } return sp+esc(s.text) }).join('');
    h = `<div class="verdict bad"><div class="v-head">Todavía no.</div><div class="answer">${txt}</div>`;
  } else {
    const d = diffHTML(r.best, S.input);
    h = `<div class="verdict bad"><div class="v-head">No.</div><div class="answer">${[it.fs?esc(it.fs):'', d.exp, it.fe?esc(it.fe):''].filter(Boolean).join(' ')}</div>
      ${S.input.trim()?`<div class="yours">Tu respuesta: ${d.you}</div>`:''}`;
  }
  h += `<div class="note">${esc(it.note)}</div>`;
  if(it.alts && it.alts.length){
    const used = r.match ? loose(full(it, r.match)) : '';
    const others = it.alts.filter(a=>loose(a)!==used && loose(a)!==loose(it.show)).slice(0,3);
    if(r.ok && loose(it.show)!==used) others.unshift(it.show);
    if(others.length) h += `<div class="alts">También vale: ${others.map(esc).join(' · ')}</div>`;
  }
  return h + '</div>';
}
function fillGap(it, a){ return capS(it.s.replace(/___ \([^)]*\)/, a).replace('___', a)) }
const capS = s => s.replace(/^([¡¿]?)(\p{L})/u,(m,a,b)=>a+b.toUpperCase());
function openFlag(){
  const box=document.getElementById('flagBox');
  box.innerHTML=`<div style="display:flex;flex-direction:column;gap:8px"><textarea id="fc" rows="3" lang="es" placeholder="¿Qué falla? (opcional)"></textarea><div class="row"><button id="fs">Guardar nota</button></div></div>`;
  document.getElementById('fc').focus();
  document.getElementById('fs').onclick=()=>{
    const it=S.cur;
    store.notes.push({id:it.id, u:it.u, tipo:'Señalado', prompt:it.p||it.s, suya:(S.blanks?S.blanks.join(' / '):'')||S.input||S.picked||'', esperada:it.show, comentario:document.getElementById('fc').value.trim()});
    save(); box.innerHTML='<p class="small">Nota guardada.</p>';
  };
}
function renderEnd(){
  const answered = Object.keys(S.attempts).length;
  const miss=[...S.missed].map(id=>byId[id]);
  const list = miss.length ? `<section><h3>Fallos (${miss.length})</h3><ul class="misses">${miss.map(it=>`<li><div class="en">${esc(it.p||it.s)}</div><div class="answer">${esc(it.show)}</div></li>`).join('')}</ul></section>` : '';
  const left = S.queue.filter(id=>!S.done.has(id)).length;
  app.innerHTML = `${header(esc(S.title))}<div class="prompt">${left?'Sesión en pausa.':'Sesión terminada.'}</div>
    <p>${plural(answered,'ítem','ítems')} · ${S.firstTry} a la primera${answered?` (${Math.round(100*S.firstTry/answered)}%)`:''}. Todo guardado.</p>
    ${left?`<p class="small">Lo que quedaba volverá a salir la próxima vez.</p>`:''}
    <div class="row"><button class="primary" id="home">Inicio</button></div>${list}`;
  document.getElementById('home').onclick=()=>renderHome();
}
document.addEventListener('keydown',e=>{
  if(!S||!S.res||e.key!=='Enter') return;
  const a=document.activeElement;
  if(a && (a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='BUTTON')) return;
  e.preventDefault(); next();
});
// a new calendar day while the app sits open: refresh the home screen
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && !S) renderHome() });
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
pruneStore();
renderHome();

</script>
